<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 / 메인</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <!-- 로그인 박스 -->
    <div id="login-box" class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">로그인</h2>
        <form id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">아이디</label>
                <input type="text" id="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">비밀번호</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition">로그인</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            계정이 없으신가요? <a href="signup.html" class="text-blue-500 font-bold">회원가입</a>
        </p>
    </div>

    <!-- 로그인 후 메인 박스 (기본 숨김) -->
    <div id="welcome-box" class="bg-white p-8 rounded-lg shadow-md w-96 hidden text-center">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">환영합니다!</h2>
        <p id="user-display" class="text-lg text-gray-600 mb-6"></p>
        <button id="logout-btn" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600 transition">로그아웃</button>
    </div>

    <script>
        const loginBox = document.getElementById('login-box');
        const welcomeBox = document.getElementById('welcome-box');
        const loginForm = document.getElementById('login-form');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');

        // 새로고침해도 로그인 상태 유지 확인
        const savedUser = localStorage.getItem('username');
        if (savedUser) {
            showWelcome(savedUser);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('username', data.username);
                showWelcome(data.username);
            } else {
                alert(data.message);
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('username');
            welcomeBox.classList.add('hidden');
            loginBox.classList.remove('hidden');
            loginForm.reset();
        });

        function showWelcome(username) {
            userDisplay.textContent = `${username}님 반갑습니닷!`;
            loginBox.classList.add('hidden');
            welcomeBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
